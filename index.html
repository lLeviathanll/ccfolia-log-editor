<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CCFOLIA Log Editor</title>
<link rel="icon" type="image/png" href="icon.png" />
<style>
/* ── 리셋 & 변수 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#181818; --bg1:#222; --bg2:#2a2a2a; --bg3:#333;
  --border:#3a3a3a; --border2:#484848;
  --text:#e4e4e4; --text2:#999; --text3:#666;
  --accent:#b0b0b0; --radius:5px; --radius-sm:3px;
  --f:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
  --trans:0.12s ease;
}
html,body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:var(--f); font-size:15px; line-height:1.5; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100vh; }

/* ── 헤더 ── */
header { display:flex; align-items:flex-end; justify-content:space-between; padding:9px 16px; background:var(--bg1); border-bottom:1px solid var(--border); flex-shrink:0; }
.header-title { font-size:15px; font-weight:600; color:var(--accent); letter-spacing:.02em; }

/* ── 탭 네비 ── */
#nav-tabs { display:flex; background:var(--bg1); border-bottom:1px solid var(--border); flex-shrink:0; }
.nav-tab { padding:8px 24px; background:none; border:none; border-bottom:2px solid transparent; color:var(--text2); font-size:14px; cursor:pointer; transition:var(--trans); }
.nav-tab:hover { color:var(--text); background:var(--bg2); }
.nav-tab.active { color:var(--text); border-bottom-color:var(--accent); }

/* ── 패널 ── */
.panel { display:none; flex-direction:column; flex:1; overflow-y:auto; padding:20px 24px; gap:14px; scrollbar-width:thin; scrollbar-color:#444 transparent; }
.panel::-webkit-scrollbar { width: 5px; }
.panel::-webkit-scrollbar-track { background: transparent; }
.panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.panel::-webkit-scrollbar-thumb:hover { background: #666; }
.panel.active { display:flex; }

/* ── 드롭존 ── */
.drop-zone { display:flex; flex-direction:column; align-items:center; gap:8px; border:1.5px dashed var(--border2); border-radius:var(--radius); padding:40px 20px; text-align:center; transition:var(--trans); }
.drop-zone.drag-over { border-color:var(--accent); background:var(--bg2); }
.drop-icon { font-size:38px; }
.drop-primary { font-size:15px; color:var(--text); }
.drop-hint { display:block; max-width:500px; text-align:left; font-size:13px; color:var(--text3); line-height:1.6; }

/* ── 상태 ── */
.status { font-size:13.5px; min-height:16px; white-space:pre-wrap; }
.status.ok  { color:#7ecfa0; } .status.err { color:#cf7e7e; } .status.info { color:#7eb8cf; }

/* ── 카드 ── */
.card { background:var(--bg1); border:1px solid var(--border); border-radius:var(--radius); padding:16px; display:flex; flex-direction:column; gap:10px; }
.card.hidden { display:none !important; }

/* ── 요약 ── */
.summary-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.summary-item { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px; text-align:center; }
.summary-num { font-size:24px; font-weight:700; color:var(--accent); }
.summary-label { font-size:12px; color:var(--text3); margin-top:2px; }

/* ── 라벨 ── */
.field-label { font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--text3); }

/* ── 칩 ── */
.chip-list { display:flex; flex-wrap:wrap; gap:6px; }
.chip { padding:4px 14px; border-radius:20px; font-size:14px; cursor:pointer; border:1px solid var(--border2); background:var(--bg2); color:var(--text2); transition:var(--trans); }
.chip.on { background:var(--bg3); color:var(--text); border-color:var(--accent); }

/* ── 버튼 ── */
.btn-primary { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:8px 18px; background:#484848; color:var(--text); border:none; border-radius:var(--radius-sm); font-size:14.5px; font-weight:500; cursor:pointer; transition:var(--trans); }
.btn-primary:hover { background:#555; }
.btn-primary.full { width:100%; }
.btn-secondary { display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:7px 18px; background:transparent; color:var(--text2); border:1px solid var(--border2); border-radius:var(--radius-sm); font-size:14.5px; cursor:pointer; transition:var(--trans); }
.btn-secondary:hover { background:var(--bg2); color:var(--text); }
.btn-secondary.full { width:100%; }
.btn-sm { padding:5px 12px; background:var(--bg2); color:var(--text2); border:1px solid var(--border); border-radius:var(--radius-sm); font-size:13.5px; cursor:pointer; transition:var(--trans); }
.btn-sm:hover { background:var(--bg3); color:var(--text); }
.icon-btn { background:none; border:none; color:var(--text2); cursor:pointer; padding:4px 6px; font-size:17px; border-radius:var(--radius-sm); transition:var(--trans); }
.icon-btn:hover { color:var(--text); background:var(--bg2); }
.icon-btn.icon-btn-fixed { width:28px; height:28px; padding:0; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
.icon-btn.icon-btn-fixed svg { width:16px; height:16px; }
.mt { margin-top:6px; }

/* ── 툴바 ── */
.toolbar { display:flex; align-items:center; justify-content:center; gap:6px; flex-shrink:0; }
.search-box { flex:1; max-width:320px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 10px; color:var(--text); font-size:14.5px; outline:none; }
.search-box:focus { border-color:var(--border2); }
.count-label { font-size:13px; color:var(--text3); margin-right:auto; }

/* ── 로그 리스트 (가상 스크롤: 보이는 범위만 실제 DOM으로 렌더링) ── */
.log-list { position:relative; overflow-y:auto; flex:1; scrollbar-width:thin; scrollbar-color:#444 transparent; overflow-anchor:none; }
.log-list::-webkit-scrollbar { width: 5px; }
.log-list::-webkit-scrollbar-track { background: transparent; }
.log-list::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.log-list::-webkit-scrollbar-thumb:hover { background: #666; }
.empty-msg { font-size:14.5px; color:var(--text3); text-align:center; padding:32px; }

/* ── 로그 아이템 (가상 스크롤에서 absolute로 배치됨) ── */
.log-item { position:absolute; left:0; right:0; width:calc(100% - 8px); max-width:720px; margin:0 auto; top:0; box-sizing:border-box; background:var(--bg1); border:1px solid var(--border); border-radius:var(--radius); padding:10px 14px; }
mark.search-mark { background:#f5a623; color:#1a1a1a; border-radius:2px; padding:0 1px; }
mark.search-mark-current { background:#ff7a1a; color:#fff; }
.log-item.muted { opacity:.4; }
.log-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.log-speaker { font-size:14.5px; font-weight:600; }
.log-tab-chip { font-size:12.5px; padding:2px 8px; border-radius:10px; background:var(--bg2); color:var(--text2); border:1px solid var(--border); }
.log-time { font-size:9px; color:var(--text2); opacity:0.75; white-space:nowrap; }
.log-actions { margin-left:auto; display:flex; gap:4px; opacity:0; transition:var(--trans); }
.log-item:hover .log-actions { opacity:1; }
.log-body { font-size:16px; color:var(--text); line-height:1.7; white-space:pre-wrap; word-break:break-all; }
.log-inline { font-size:15px; color:#707070; line-height:1.6; flex:1; min-width:0; word-break:break-all; }
.log-body-inline { white-space:pre-wrap; }
.log-edit-area { display:none; flex-direction:column; gap:5px; margin-top:8px; }
.log-edit-area.open { display:flex; }
.log-textarea { width:100%; flex:1; background:var(--bg2); border:1px solid var(--border2); border-radius:var(--radius-sm); padding:6px 8px; color:var(--text); font-size:14.5px; line-height:1.6; resize:none; overflow-y:auto; outline:none; font-family:var(--f); scrollbar-width:thin; scrollbar-color:#444 transparent; }
.log-textarea::-webkit-scrollbar { width: 5px; }
.log-textarea::-webkit-scrollbar-track { background: transparent; }
.log-textarea::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.log-textarea::-webkit-scrollbar-thumb:hover { background: #666; }
.log-edit-btns { display:flex; gap:5px; justify-content:flex-end; flex-shrink:0; }

/* ── 미리보기 ── */
#preview-wrap { flex:1; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; min-height:0; }
#preview-host { width:100%; height:100%; background:#1a1a1a; display:block; }

/* ── 사이드바 접기 ── */
.sidebar-section { border-bottom:1px solid var(--border); }
.sidebar-section:last-child { border-bottom:none; }
.sidebar-section-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 0; cursor:pointer; font-size:13px; font-weight:600;
  color:var(--text2); user-select:none;
}
.sidebar-section-header:hover { color:var(--text); }
.sidebar-section-arrow {
  font-size:14px; color:var(--text3);
  display:inline-flex; align-items:center; justify-content:center;
  width:16px; height:16px;
}
.sidebar-section-body { padding-bottom:12px; display:flex; flex-direction:column; gap:6px; }
.sidebar-section.collapsed .sidebar-section-body { display:none; }

/* ── 출력 패널 리사이즈 핸들 ── */
.resize-handle {
  width: 5px;
  flex-shrink: 0;
  cursor: col-resize;
  background: var(--border);
  transition: background 0.15s;
  position: relative;
  z-index: 1;
}
.resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

/* ── 출력 패널 (좌우 분할) ── */
.panel-export-split {
  display: none;
  flex-direction: row !important;
  padding: 0 !important;
  gap: 0 !important;
  overflow: hidden !important;
}
.panel-export-split.active { display: flex; }

.export-left {
  width: 260px;
  min-width: 220px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 0;
  overflow-y: auto;
  padding: 16px 16px;
  border-right: 1px solid var(--border);
  scrollbar-width: thin;
  scrollbar-color: #444 transparent;
}
.export-left::-webkit-scrollbar { width: 5px; }
.export-left::-webkit-scrollbar-track { background: transparent; }
.export-left::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
.export-left::-webkit-scrollbar-thumb:hover { background: #666; }
.export-right {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--bg1);
}
.field-input { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 10px; color:var(--text); font-size:14.5px; outline:none; width:100%; }
.field-input:focus { border-color:var(--border2); }
.check-group { display:flex; flex-direction:column; gap:6px; }
.check-group label { display:flex; align-items:center; gap:7px; font-size:14.5px; cursor:pointer; }
.check-group input[type=checkbox] { accent-color:var(--accent); }

/* ── 캐릭터/탭 색상 ── */
.speaker-list { display:flex; flex-direction:column; gap:6px; }
.speaker-row { display:flex; align-items:center; gap:9px; }
.speaker-name { flex:1; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.color-swatch { width:22px; height:22px; border-radius:4px; border:1px solid var(--border2); flex-shrink:0; cursor:pointer; }
.color-swatch-wrap { position:relative; display:inline-flex; flex-shrink:0; width:22px; height:22px; }
.color-swatch-wrap .color-swatch { width:100%; height:100%; }
.color-swatch-wrap input[type=color] { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:none; padding:0; }
.hex-input { width:74px; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:3px 6px; color:var(--text); font-size:12px; outline:none; font-family:monospace; flex-shrink:0; }
.hex-input:focus { border-color:var(--accent); }
.hex-input:disabled, .color-swatch.disabled { opacity:0.3; pointer-events:none; }
input[type="color"] { width:30px; height:24px; border:1px solid var(--border); border-radius:var(--radius-sm); background:none; cursor:pointer; padding:1px; flex-shrink:0; }
.hint-text { font-size:13px; color:var(--text3); font-style:italic; }
.section-notice { font-size:11.5px; color:var(--text3); margin:0 0 8px; line-height:1.4; }

/* ── 캐릭터 이미지 URL ── */
.speaker-img-row { display:flex; flex-direction:column; gap:4px; padding-bottom:8px; border-bottom:1px solid var(--border); }
.speaker-img-row:last-child { border-bottom:none; padding-bottom:0; }
.speaker-img-label { display:flex; align-items:center; gap:7px; }
.speaker-img-thumb { width:44px; height:44px; border-radius:4px; object-fit:cover; border:1px solid var(--border2); flex-shrink:0; background:var(--bg3); display:none; }
.speaker-img-thumb.show { display:block; }
.speaker-img-name { font-size:14px; color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.speaker-img-input { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:5px 8px; color:var(--text2); font-size:13px; outline:none; }
.speaker-img-input:focus { border-color:var(--border2); color:var(--text); }
.speaker-img-input:disabled { opacity:0.4; }
.speaker-img-thumb.disabled { opacity:0.4; }
</style>
</head>
<body>
<div id="app">

  <header>
    <span class="header-title"><img src="icon.png" alt="" style="width:20px;height:20px;vertical-align:-4px;border-radius:5px;margin-right:0;" /> CCFOLIA Log Editor</span>
    <span id="header-version" style="font-size:12px;color:var(--text3);opacity:0.85;margin-left:8px;margin-right:auto"></span>

  </header>

  <nav id="nav-tabs">
    <button class="nav-tab active" data-target="panel-load">불러오기</button>
    <button class="nav-tab" data-target="panel-edit">편집</button>
    <button class="nav-tab" data-target="panel-export">출력</button>
  </nav>

  <!-- 불러오기 -->
  <section id="panel-load" class="panel active">
    <label id="drop-zone" class="drop-zone">
      <input id="file-input" type="file" accept=".html,.htm,.json" hidden />
      <span class="drop-icon">📂</span>
      <span class="drop-primary">클릭하거나 파일을 드래그하세요</span>
      <span class="drop-hint">・ccfolia에서 다운로드 받은 .json / .html 로그 파일 (.json 사용 권장)<br>・이 에디터에서 수정한 .html 로그 파일<br>・추출기로 추출한 .json 파일</span>
    </label>
    <div id="load-status" class="status"></div>
    <div id="log-info" class="card hidden">
      <div id="summary-row" class="summary-row"></div>
      <div id="tab-chips" class="chip-list" style="display:none"></div>
      <button id="btn-go-edit" class="btn-primary full mt">불러오기 완료 →</button>
    </div>
  </section>

  <!-- 편집 -->
  <section id="panel-edit" class="panel">
    <div class="toolbar" style="display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);">
      <span></span>
      <div style="display:flex; align-items:center; gap:6px;">
        <input id="search-box" type="text" placeholder="검색…" class="search-box" style="max-width:200px;" />
        <button id="btn-search-prev" class="icon-btn icon-btn-fixed" title="이전 결과"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;"><path d="M7 15l5-6 5 6"/></svg></button>
        <button id="btn-search-next" class="icon-btn icon-btn-fixed" title="다음 결과"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;"><path d="M7 9l5 6 5-6"/></svg></button>
        <button id="btn-search-clear" class="icon-btn icon-btn-fixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <span id="edit-count" class="count-label"></span>
    </div>
    <div id="log-list" class="log-list">
      <p class="empty-msg">로그를 먼저 불러오세요.</p>
    </div>
  </section>

  <!-- 출력 -->
  <section id="panel-export" class="panel panel-export-split">
    <!-- 좌: 설정 폼 -->
    <div class="export-left" id="export-left">
      <div class="sidebar-section">
        <div class="sidebar-section-header"><span>출력 설정</span><span class="sidebar-section-arrow">▾</span></div>
        <div class="sidebar-section-body">
          <label class="field-label">타이틀</label>
          <input id="out-title" type="text" class="field-input" placeholder="시나리오 제목 등" />
          <label class="field-label">테마</label>
          <select id="out-theme" class="field-input">
            <option value="dark" selected>기본</option>
            <option value="default">라이트</option>
            <option value="novel">소설풍</option>
            <option value="minimal">미니멀</option>
          </select>
          <label class="field-label">출력할 탭 선택</label>
          <div id="out-tab-chips" class="chip-list">
            <span class="hint-text">로그를 불러오면 표시됩니다.</span>
          </div>
          <label class="field-label">옵션</label>
          <div class="check-group">
            <label><input type="checkbox" id="opt-tab" checked /> 탭 이름 표시</label>
            <label><input type="checkbox" id="opt-img" checked /> 캐릭터 이미지 표시</label>
            <label><input type="checkbox" id="opt-date" checked /> 날짜 표시</label>
          </div>
          <button id="btn-download" class="btn-primary full mt">⬇ HTML 다운로드</button>
          <button id="btn-copy-html" class="btn-secondary full mt">📋 HTML 복사</button>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-header"><span>탭 배경색</span><span class="sidebar-section-arrow">▾</span></div>
        <div class="sidebar-section-body">
          <div id="tab-bg-colors" class="speaker-list">
            <span class="hint-text">로그를 불러오면 표시됩니다.</span>
          </div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-header"><span>캐릭터 색상</span><span class="sidebar-section-arrow">▾</span></div>
        <div class="sidebar-section-body">
          <div id="speaker-colors" class="speaker-list">
            <span class="hint-text">로그를 불러오면 표시됩니다.</span>
          </div>
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-header"><span>캐릭터 이미지 URL</span><span class="sidebar-section-arrow">▾</span></div>
        <div class="sidebar-section-body">
          <p class="section-notice">url을 변경할 경우 캐릭터별 일괄 수정이 적용됩니다.</p>
          <div id="speaker-images" class="speaker-list">
            <span class="hint-text">로그를 불러오면 표시됩니다.</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우: 미리보기 고정 -->
    <div class="resize-handle" id="resize-handle"></div>
    <div class="export-right">
      <div class="preview-header">
        <span class="field-label" style="font-size:13px">미리보기</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <input id="preview-search-box" type="text" placeholder="검색…" class="search-box" style="max-width:200px;" />
          <button id="btn-preview-search-prev" class="icon-btn icon-btn-fixed" title="이전 결과"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;"><path d="M7 15l5-6 5 6"/></svg></button>
          <button id="btn-preview-search-next" class="icon-btn icon-btn-fixed" title="다음 결과"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:19px;height:19px;"><path d="M7 9l5 6 5-6"/></svg></button>
          <button id="btn-preview-search-clear" class="icon-btn icon-btn-fixed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          <span id="preview-search-count" class="count-label"></span>
        </div>
      </div>
      <div id="preview-wrap">
        <div id="preview-host"></div>
      </div>
    </div>
  </section>

  <!-- 설정 -->


</div><!-- #app -->

<script>
'use strict';

// ── 버전 ──────────────────────────────────────────────────────────
const VERSION = '2.2.2';

// ── 상태 ──────────────────────────────────────────────────────────
const S = {
  entries: [], filtered: [], edited: [],
  activeTabs: new Set(),
  outputTabs: new Set(),
  speakerColors: {}, speakerColorsEnabled: {}, tabBgColors: {}, tabBgColorsEnabled: {}, tabBgColorsCustom: {}, speakerImages: {}, speakerImagesEnabled: {},
};

// ── DOM 헬퍼 ──────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const entryTimeLabel = e => {
  if (!e) return '';
  // 신 형식(정밀 시:분:초 있음): "26/08/27 14:02:06" 형태로 조합
  if (e.time) {
    const shortDate = (e.date || '').replace(/^\d{2}(\d{2})\//, '$1/');
    return shortDate ? `${shortDate} ${e.time}` : e.time;
  }
  // 구 형식(날짜만 있음, 시간 정보 자체가 없거나 모호함): 기존처럼 날짜만 표시
  const raw = e.date || '';
  return raw.replace(/^\d{2}(\d{2})\//, '$1/');
};

// ── ccfolia HTML 파서 ─────────────────────────────────────────────
// 구조: <p style="color:#xxx;"><span> [tab]</span><span>캐릭터</span> :<span>메시지</span></p>
function parseCcfoliaHtml(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const entries = [];
  let id = 0;
  doc.querySelectorAll('body > p[style]').forEach(p => {
    const spans = p.querySelectorAll('span');
    if (spans.length < 3) return;

    const tabMatch = spans[0].textContent.trim().match(/\[([^\]]+)\]/);
    const tab = tabMatch ? tabMatch[1] : 'other';
    const name = spans[1].textContent.trim();

    const tmp = document.createElement('div');
    tmp.innerHTML = spans[2].innerHTML.replace(/<br\s*\/?>/gi, '\n');
    const message = tmp.textContent.trim();
    if (!message) return;

    const cm = p.getAttribute('style')?.match(/color\s*:\s*(#[0-9a-fA-F]{3,8}|[a-z]+)/i);
    const color = cm ? cm[1] : '#aaaaaa';

    const key = name + '' + color;
    entries.push({ id: id++, tab, name, color, key, message, hidden: false });
  });
  return entries;
}

// ── 초기화 ────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  $('header-version').textContent = VERSION + ' by 파멸의씨푸드';
  setupNavTabs();
  setupLoadPanel();
  setupEditPanel();
  setupPreviewPanel();
  setupExportPanel();
});

// ── 탭 네비게이션 ─────────────────────────────────────────────────
function setupNavTabs() {
  document.querySelectorAll('.nav-tab').forEach(btn => {
    btn.addEventListener('click', () => switchPanel(btn.dataset.target));
  });
}

// ── 불러오기 패널 ─────────────────────────────────────────────────
function setupLoadPanel() {
  // 파일 input (클릭)
  $('file-input').addEventListener('change', e => {
    const f = e.target.files[0];
    if (f) readFile(f);
    e.target.value = ''; // 같은 파일 재선택 허용
  });

  // 드래그 앤 드롭
  const zone = $('drop-zone');
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  $('btn-go-edit').addEventListener('click', applyFilter);
}

function readFile(file) {
  setStatus('load-status', 'info', '⏳ 읽는 중…');
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    // JSON 로그 (확장 프로그램 등에서 추출한 데이터, 또는 CCFOLIA 신규 내보내기 JSON)
    if (file.name.toLowerCase().endsWith('.json')) {
      let raw;
      try { raw = JSON.parse(text); } catch (err) {
        setStatus('load-status', 'err', `❌ JSON 파싱 실패: ${err.message}`);
        return;
      }
      // 신규 형식: { messages: [...], images: {...} }
      if (raw && !Array.isArray(raw) && Array.isArray(raw.messages)) {
        processJsonV2(file.name, raw);
      } else {
        processJson(file.name, text);
      }
      return;
    }
    // 에디터 출력 HTML이면 복원 시도
    if (file.name.endsWith('.html') && text.includes('id="ccfolia-editor-data"')) {
      if (restoreFromEditorHtml(file.name, text)) return;
    }
    // 신규 CCFOLIA 내보내기 HTML (message-list 구조)
    if (text.includes('class="message-list"')) {
      processTextV2(file.name, text);
      return;
    }
    processText(file.name, text);
  };
  reader.onerror = () => setStatus('load-status', 'err', '❌ 파일 읽기 실패');
  reader.readAsText(file, 'UTF-8');
}

function restoreFromEditorHtml(filename, text) {
  try {
    const match = text.match(/<script[^>]+id="ccfolia-editor-data"[^>]*>([\s\S]*?)<\/script>/);
    if (!match) return false;
    const data = JSON.parse(match[1]);

    // 버전별 마이그레이션 (현재는 VERSION 단일)
    const version = data.version || '1.0.0';

    // v2.2.2 이후 저장된 파일은 이미지를 공유 목록(images[]) + 인덱스(imgRef)로 저장함(중복 방지).
    // data.images가 있으면 그 방식으로 보고 원래 image 문자열로 복원하고, 없으면(구버전 파일)
    // entries[].image / speakerImages[key]에 값이 직접 들어있는 기존 방식 그대로 사용한다.
    let restoredEntries = data.entries;
    let restoredSpeakerImages = data.speakerImages || {};
    if (Array.isArray(data.images)) {
      restoredEntries = data.entries.map(e => {
        const { imgRef, ...rest } = e;
        return { ...rest, image: (imgRef != null && data.images[imgRef]) ? data.images[imgRef] : '' };
      });
      restoredSpeakerImages = {};
      Object.keys(data.speakerImages || {}).forEach(key => {
        const ref = data.speakerImages[key];
        restoredSpeakerImages[key] = (ref != null && data.images[ref]) ? data.images[ref] : '';
      });
    }

    // 상태 복원
    S.entries = restoredEntries;
    S.edited  = restoredEntries.map(e => ({ ...e }));
    S.filtered = S.edited;
    S.outputTabs = new Set(data.outputTabs || restoredEntries.map(e => e.tab));
    S.activeTabs = new Set(restoredEntries.map(e => e.tab));
    S.speakerColors        = data.speakerColors        || {};
    S.speakerColorsEnabled = data.speakerColorsEnabled || {};
    S.speakerImages        = restoredSpeakerImages;
    S.speakerImagesEnabled = data.speakerImagesEnabled || {};
    // v1.0.2 이전(캐릭터 이미지 on/off 토글이 생기기 전)에 저장된 파일은 speakerImagesEnabled 자체가 없음.
    // 그 시절엔 speakerImages에 값이 있으면 항상 적용되는 구조였으므로, 그런 키들은 enabled=true로 마이그레이션.
    if (data.speakerImagesEnabled === undefined) {
      Object.keys(S.speakerImages).forEach(key => { S.speakerImagesEnabled[key] = true; });
    }
    S.tabBgColors          = data.tabBgColors          || {};
    S.tabBgColorsEnabled   = data.tabBgColorsEnabled   || {};
    S.tabBgColorsCustom    = data.tabBgColorsCustom    || {};

    // 출력 설정 복원
    if (data.title)   $('out-title').value  = data.title;
    if (data.theme)   $('out-theme').value  = data.theme;
    if (data.showTab !== undefined) $('opt-tab').checked = data.showTab;
    if (data.showImg !== undefined) $('opt-img').checked = data.showImg;
    if (data.showDate !== undefined) $('opt-date').checked = data.showDate;

    // 요약 업데이트
    const tabs = [...new Set(S.entries.map(e => e.tab))];
    const speakers = [...new Set(S.entries.map(e => e.name))];
    $('summary-row').innerHTML =
      `<div class="summary-item"><div class="summary-num">${S.entries.length}</div><div class="summary-label">총 로그</div></div>
       <div class="summary-item"><div class="summary-num">${speakers.length}</div><div class="summary-label">캐릭터</div></div>
       <div class="summary-item"><div class="summary-num">${tabs.length}</div><div class="summary-label">탭</div></div>`;

    setStatus('load-status', 'ok', `✅ ${filename} — 에디터 데이터 복원 완료 (v${data.version})`);

    // 편집 탭 로그 목록 복원 후 출력 탭으로 이동하며 렌더링
    goToExportPanelReady();
    return true;
  } catch(err) {
    console.warn('restoreFromEditorHtml failed:', err);
    return false;
  }
}

// JSON 배열([{tab,name,color,message}, ...])을 entries로 변환해서 처리
// (확장 프로그램 등 외부 도구에서 추출한 로그를 불러올 때 사용)
function processJson(filename, text) {
  let raw;
  try {
    raw = JSON.parse(text);
  } catch (err) {
    setStatus('load-status', 'err', `❌ JSON 파싱 실패: ${err.message}`);
    return;
  }
  if (!Array.isArray(raw)) {
    setStatus('load-status', 'err', '❌ JSON 형식이 올바르지 않습니다. (배열이어야 함)');
    return;
  }
  let id = 0;
  const entries = raw.map(r => {
    const tab = String(r.tab ?? 'other').trim() || 'other';
    const name = String(r.name ?? '').trim();
    const color = String(r.color ?? '#aaaaaa').trim() || '#aaaaaa';
    const message = String(r.message ?? '').trim();
    const image = String(r.avatarUrl ?? r.image ?? '').trim();
    const date = String(r.date ?? '').trim();
    const time = String(r.time ?? '').trim();
    const key = name + '\uE000' + color;
    return { id: id++, tab, name, color, key, message, image, date, time, hidden: false };
  }).filter(e => e.message);

  if (!entries.length) {
    setStatus('load-status', 'err', '❌ 로그를 찾지 못했습니다.\nJSON 항목에 message 필드가 비어있지 않은지 확인해주세요.');
    return;
  }
  processEntries(filename, entries);
}

// Date 객체를 "YYYY/MM/DD"+"HH:MM:SS"로 변환 (신 JSON/신 HTML 파서 공통)
function formatDateTime(d) {
  if (isNaN(d)) return { date: '', time: '' };
  const date = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}`;
  const time = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
  return { date, time };
}

function processJsonV2(filename, raw) {
  const images = raw.images || {};
  let id = 0;
  const entries = raw.messages.map(m => {
    const name = String(m.name ?? '').trim();
    if (!name) return null;
    const color = String(m.color ?? '#aaaaaa').trim() || '#aaaaaa';
    // channel은 비밀 탭의 경우 임의 내부 ID라 channelName(사람이 읽을 수 있는 라벨)을 우선 사용
    const tab = String(m.channelName ?? m.channel ?? 'other').trim() || 'other';

    let message = String(m.text ?? '');
    const roll = m.extend && m.extend.roll;
    // success/critical/fumble 같은 구조화된 값은 신뢰할 수 없는 것으로 확인되어(같은 판정 패턴이
    // 로그마다 다르게 세팅됨) 쓰지 않고, 결과 문자열을 메시지에 합쳐서 기존 텍스트 판별 로직을 그대로 재사용한다.
    if (roll && roll.result) {
      const rollText = String(roll.result).trim();
      message = message ? `${message}\n${rollText}` : rollText;
    }
    message = message.trim();
    if (!message) return null;

    let date = '', time = '';
    if (typeof m.createdAt === 'number') {
      ({ date, time } = formatDateTime(new Date(m.createdAt)));
    }

    const image = (m.iconImage && images[m.iconImage]) ? images[m.iconImage] : '';
    const key = name + '\uE000' + color;
    return { id: id++, tab, name, color, key, message, hidden: false, image, date, time };
  }).filter(Boolean);

  if (!entries.length) {
    setStatus('load-status', 'err', '❌ 로그를 찾지 못했습니다.');
    return;
  }
  processEntries(filename, entries);
}

// HTML 파서(구/신 버전)를 받아 공통 처리 (파싱 실패/빈 결과 처리 동일)
function processTextWith(parseFn, filename, text) {
  try {
    const entries = parseFn(text);
    if (!entries.length) {
      setStatus('load-status', 'err', '❌ 로그를 찾지 못했습니다.\nccfolia에서 내보낸 .html 파일인지 확인해주세요.');
      return;
    }
    processEntries(filename, entries);
  } catch(err) {
    setStatus('load-status', 'err', `❌ 오류: ${err.message}`);
  }
}
function processText(filename, text) { processTextWith(parseCcfoliaHtml, filename, text); }

function processTextV2(filename, text) { processTextWith(parseCcfoliaHtmlV2, filename, text); }

// 신규 CCFOLIA 내보내기 HTML 파서 (message-list / article.message 구조).
// 탭은 비밀 탭의 경우 data-channel이 임의 내부 ID라 channel-name 라벨(대괄호 벗김)을 우선 사용.
// 주사위 판정은 message-text와 roll-result를 합쳐서 기존 텍스트 판별 로직(getDiceGrade)에 그대로 태운다.
function parseCcfoliaHtmlV2(htmlText) {
  const doc = new DOMParser().parseFromString(htmlText, 'text/html');
  const entries = [];
  let id = 0;

  // <style> 안의 .avatar-image-N { background-image: url("...") } 매핑 파싱
  const imageMap = {};
  const styleText = Array.from(doc.querySelectorAll('style')).map(s => s.textContent).join('\n');
  const imgRegex = /\.avatar-image-(\d+)\s*\{[^}]*background-image:\s*url\((["']?)(.*?)\2\)/g;
  let im;
  while ((im = imgRegex.exec(styleText))) {
    imageMap[im[1]] = im[3];
  }

  doc.querySelectorAll('article.message').forEach(article => {
    const speakerEl = article.querySelector('.speaker');
    // 시스템 메시지(체력 변동 등)는 화자 요소 자체가 없음 - JSON 형식과 동일하게 "system"으로 대체
    const name = speakerEl ? speakerEl.textContent.trim() : 'system';
    if (!name) return;

    const colorMatch = speakerEl ? (speakerEl.getAttribute('style') || '').match(/--speaker-color:\s*(#[0-9a-fA-F]{3,8}|[a-z]+)/i) : null;
    const color = colorMatch ? colorMatch[1] : (speakerEl ? '#aaaaaa' : '#888888');

    const dataChannel = article.getAttribute('data-channel') || '';
    const channelNameEl = article.querySelector('.channel-name');
    const channelLabel = channelNameEl ? channelNameEl.textContent.trim().replace(/^\[|\]$/g, '') : '';
    // main/info/other 표준 채널은 data-channel(영문 키)로 정규화해서 JSON 파서와 값이 일치하게 함.
    // 비밀/커스텀 채널은 data-channel이 임의 내부 ID라 읽을 수 있는 라벨을 그대로 사용.
    const tab = ['main', 'info', 'other'].includes(dataChannel) ? dataChannel : (channelLabel || dataChannel || 'other');

    const textEl = article.querySelector('.message-text');
    let message = textEl ? textEl.textContent : '';
    const rollEl = article.querySelector('.roll-result');
    if (rollEl) {
      const rollText = rollEl.textContent.trim();
      message = message ? `${message}\n${rollText}` : rollText;
    }
    message = message.trim();
    if (!message) return;

    let date = '', time = '';
    const timeEl = article.querySelector('.timestamp');
    const iso = timeEl ? timeEl.getAttribute('datetime') : null;
    if (iso) {
      ({ date, time } = formatDateTime(new Date(iso)));
    }

    let image = '';
    const avatarEl = article.querySelector('.avatar');
    if (avatarEl) {
      const cls = Array.from(avatarEl.classList).find(c => c.startsWith('avatar-image-'));
      if (cls) image = imageMap[cls.replace('avatar-image-', '')] || '';
    }

    const key = name + '\uE000' + color;
    entries.push({ id: id++, tab, name, color, key, message, hidden: false, image, date, time });
  });

  return entries;
}

function processEntries(filename, entries) {
  try {
    S.entries = entries;
    const tabs = [...new Set(entries.map(e => e.tab))];
    S.activeTabs = new Set(tabs);
    S.outputTabs = new Set(tabs);
    S.speakerColors = {};
    S.speakerColorsEnabled = {};
    S.speakerImages = {};
    S.speakerImagesEnabled = {};
    entries.forEach(e => { if (!(e.key in S.speakerColors)) { S.speakerColors[e.key] = e.color; S.speakerColorsEnabled[e.key] = false; } });
    entries.forEach(e => { if (e.image && !(e.key in S.speakerImages)) { S.speakerImages[e.key] = e.image; } });
    S.tabBgColors = {};
    tabs.forEach(t => { S.tabBgColors[t] = ''; S.tabBgColorsEnabled[t] = false; S.tabBgColorsCustom[t] = false; });

    // 요약
    const speakers = [...new Set(entries.map(e => e.name))];
    $('summary-row').innerHTML =
      `<div class="summary-item"><div class="summary-num">${entries.length}</div><div class="summary-label">총 로그</div></div>
       <div class="summary-item"><div class="summary-num">${speakers.length}</div><div class="summary-label">캐릭터</div></div>
       <div class="summary-item"><div class="summary-num">${tabs.length}</div><div class="summary-label">탭</div></div>`;

    // 탭 칩
    const chipsEl = $('tab-chips');
    chipsEl.innerHTML = '';
    tabs.forEach(tab => {
      const btn = document.createElement('button');
      btn.className = 'chip on'; btn.dataset.tab = tab;
      btn.textContent = TAB_LABEL[tab] ?? tab;
      btn.addEventListener('click', () => {
        const on = btn.classList.toggle('on');
        on ? S.activeTabs.add(tab) : S.activeTabs.delete(tab);
      });
      chipsEl.appendChild(btn);
    });

    $('log-info').classList.remove('hidden');
    setStatus('load-status', 'ok', `✅ ${filename} — ${entries.length}개 로그 불러오기 완료`);
  } catch(err) {
    setStatus('load-status', 'err', `❌ 오류: ${err.message}`);
  }
}

// 편집 목록을 그리고 출력 탭으로 이동해서 관련 설정 UI/미리보기를 전부 새로 그린다.
// (필터 적용 시, 에디터 저장 파일 복원 시 공통으로 필요한 순서)
function goToExportPanelReady() {
  renderLogList();
  switchPanel('panel-export');
  renderOutTabChips();
  renderSpeakerColors();
  renderTabBgColors();
  renderSpeakerImages();
  doRefreshPreview();
}

function applyFilter() {
  S.filtered = S.entries.filter(e => S.activeTabs.has(e.tab));
  S.edited = S.filtered.map(e => ({ ...e }));
  goToExportPanelReady();
}

// ── 편집 패널 ─────────────────────────────────────────────────────
// ── 찾기(Ctrl+F 스타일) 검색: 목록을 필터링하지 않고, 일치하는 위치로 이동 + 강조만 한다.
// 편집 탭/미리보기가 완전히 같은 로직을 쓰되, 각자의 상태(목록/오프셋/스크롤 대상 등)만 다르다.
// ── 찾기(Ctrl+F 스타일) 검색: 카드 DOM을 추적해서 강조하지 않고, 카드를 그릴 때마다
// 메시지/이름 텍스트 안의 일치 부분을 <mark>로 감싸서 표시한다. 카드 전체에 클래스를 붙이는
// 방식은 가상 스크롤이 DOM 노드를 계속 재활용하는 것과 부딪혀서(재활용된 카드가 엉뚱하게
// 강조되는 등) 경합 문제가 반복됐는데, 텍스트 자체에 반영하면 카드가 항상 "지금 인덱스에
// 맞는 내용"으로 새로 그려지므로 그런 문제 자체가 구조적으로 발생할 수 없다.
const searchState = {
  log:     { query: '', matches: [], current: 0 },
  preview: { query: '', matches: [], current: 0 },
};
function searchContext(kind) {
  if (kind === 'log') {
    return {
      list: () => S._vList, offsets: () => S._vOffsets, scrollEl: () => $('log-list'),

// <mark>로 감싼다. 현재 위치(카드)면 더 진한 스타일, 그 외 일치 카드는 옅은 스타일을 쓴다.

// <mark> 강조가 최신 상태로 반영되게 한다 (재활용 풀에 있던 헌 DOM은 버리고 새로 만듦).

function setupEditPanel() {
  const sb = $('search-box');
  let searchTimer = null;
  sb.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runLogSearch, 200);
  });
  sb.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); goToSearchMatch('log', e.shiftKey ? -1 : 1); }
  });
  $('btn-search-next').addEventListener('click', () => goToSearchMatch('log', 1));
  $('btn-search-prev').addEventListener('click', () => goToSearchMatch('log', -1));
  $('btn-search-clear').addEventListener('click', () => {
    clearTimeout(searchTimer);
    sb.value = '';
    clearSearch('log');
  });

  // 가상 스크롤: 스크롤/리사이즈 시 보이는 범위만 다시 계산해서 그림
  let scrollScheduled = false;
  $('log-list').addEventListener('scroll', () => {
    if (S._vInternalScroll) {
      S._vInternalScroll = false;
      // 우리가 옮기려던 값과 실제로 일치할 때만 무시 (그 사이 사용자가 추가로 스크롤했으면
      // 브라우저가 두 변경을 한 이벤트로 합쳐 보고할 수 있는데, 이건 무시하면 안 되는 진짜 스크롤임).
      if (Math.abs($('log-list').scrollTop - S._vInternalScrollTarget) < 1) return;
    }
    if (scrollScheduled) return;

    requestAnimationFrame(() => { scrollScheduled = false; renderVisibleLogRows(); });
  });
  window.addEventListener('resize', () => renderVisibleLogRows());
}

// 가상 스크롤 추정 "콘텐츠" 높이(간격 제외). 처음엔 아래 기본값을 쓰지만, 실측이 들어올 때마다
// 이동평균으로 자가 보정되어(LOG_ROW_H_CALIBRATED) 이후 미측정 항목의 기본값이 점점 더 정확해진다.
// -> 스크롤해서 새 항목이 처음 보일 때 "작다가 커지는" 튐을 최소화하기 위함.
const LOG_ROW_H = { other: 36, normal: 90 };
const LOG_ROW_H_CALIBRATED = { other: null, normal: null };
const LOG_ROW_GAP = 6; // 기존 flex gap:6px를 절대 위치 계산에도 그대로 반영

// 편집창 높이를 메시지 내용(글자 수·줄바꿈 개수)만으로 미리 계산한다. DOM을 실제로 측정하지
// 않고도 "미리 알 수 있는 값"이라는 점을 유지해서, 겹침 방지를 위한 재측정 로직이 여전히 필요 없게 한다.
const EDIT_TEXTAREA_FONT = 14.5, EDIT_TEXTAREA_LINE_HEIGHT_RATIO = 1.6;
const EDIT_CHARS_PER_LINE = 42;   // textarea 폭 기준 한 줄당 대략적인 글자 수
const EDIT_MIN_LINES = 2, EDIT_MAX_LINES = 14; // 너무 작거나 커지지 않게 클램프
const EDIT_BTN_ROW_H = 30;        // 취소/저장 버튼 줄 높이(대략)
const EDIT_AREA_GAP = 8;          // .log-edit-area의 margin-top

function estimateEditTextareaHeight(message) {
  const rawLines = String(message || '').split('\n');
  let totalLines = 0;
  rawLines.forEach(line => { totalLines += Math.max(1, Math.ceil(line.length / EDIT_CHARS_PER_LINE)); });
  const lines = Math.min(EDIT_MAX_LINES, Math.max(EDIT_MIN_LINES, totalLines));
  const lineHeight = EDIT_TEXTAREA_FONT * EDIT_TEXTAREA_LINE_HEIGHT_RATIO;
  return Math.round(lines * lineHeight) + 12; // 상하 패딩(6px*2)
}

function editAreaHeightFor(entry) {
  return estimateEditTextareaHeight(entry.message) + 5 /* .log-edit-area gap */ + EDIT_BTN_ROW_H + EDIT_AREA_GAP;
}

// 항목 타입(일반/잡담) 판별과, 실측값 없으면 보정된 기본값을 쓰는 높이 조회 로직은
// 편집 탭/미리보기가 완전히 동일해서 공용 함수로 뺀다.
function rowType(list, i) { return list[i].tab === 'other' ? 'other' : 'normal'; }
function calibratedOrDefault(measuredMap, i, type, calibrated, defaults) {
  const measured = measuredMap.get(i);
  if (measured != null) return measured;
  return calibrated[type] ?? defaults[type];
}

function logRowType(i) { return rowType(S._vList, i); }

function logRowContentHeight(i) {
  const type = logRowType(i);
  const base = calibratedOrDefault(S._vMeasured, i, type, LOG_ROW_H_CALIBRATED, LOG_ROW_H);
  const entry = S._vList[i];
  const editOpen = S._vEditOpenIds && S._vEditOpenIds.has(entry.id);
  return base + (editOpen ? editAreaHeightFor(entry) : 0);
}

// 실측값을 기록하면서, 그 타입(일반/잡담)의 기본 추정치도 이동평균으로 같이 보정
const LOG_CALIBRATION_SAMPLES = { other: [], normal: [] };

// 표본을 모아 중앙값으로 기본 추정치를 고정하는 보정 로직 (편집 탭/미리보기 공통 사용).
// 평균 대신 중앙값을 쓰는 이유: 유난히 길거나 짧은 메시지 한두 개가 우연히 초반 샘플에 섞였을 때
// 그것 때문에 추정치 전체가 계속 어긋난 채로 남는데(예: 대부분 85px인데 411px짜리 하나 때문에
// 140으로 고정), 중앙값은 그런 소수의 극단값에 거의 영향을 안 받는다. 목표 개수에 도달한 뒤로는
// 값을 고정한다 - 계속 갱신하면 아직 안 본 수천 개 항목의 예상 높이가 그때마다 같이 바뀌어서
// 전체 목록 높이가 크게 출렁이고 스크롤 위치/스크롤바 동작이 불안정해지는 문제가 있었다.
function medianCalibrate(samplesArr, target, newValue) {
  if (samplesArr.length >= target) return undefined; // 이미 고정됨
  samplesArr.push(newValue);
  if (samplesArr.length !== target) return undefined;
  const sorted = [...samplesArr].sort((a, b) => a - b);
  const mid = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[mid] : Math.round((sorted[mid - 1] + sorted[mid]) / 2);

function recordLogRowMeasurement(i, realH) {
  S._vMeasured.set(i, realH);
  const type = logRowType(i);
  const calibrated = medianCalibrate(LOG_CALIBRATION_SAMPLES[type], LOG_CALIBRATION_TARGET, realH);
  if (calibrated !== undefined) LOG_ROW_H_CALIBRATED[type] = calibrated;

// 오프셋 배열 계산(편집 탭/미리보기 공통) - 간격과 높이 조회 함수만 다르게 넘겨받는다.
function computeOffsets(list, gap, heightFn) {
  const offsets = new Array(list.length + 1);
  offsets[0] = 0;
  for (let i = 0; i < list.length; i++) {

  }

}
function computeLogOffsets(list) { return computeOffsets(list, LOG_ROW_GAP, logRowContentHeight); }

function renderLogList() {
  const container = $('log-list');
  if ($('search-box')) $('search-box').value = '';
  clearSearch('log');
  if (!S.edited.length) {
    container.innerHTML = '<p class="empty-msg">로그를 먼저 불러오세요.</p>';
    return;
  }
  const list = S.edited;

  const idToIndex = new Map();
  S.edited.forEach((e, i) => idToIndex.set(e.id, i));

  S._vList = list;
  S._vIdToIndex = idToIndex;
  S._vMeasured = new Map(); // index -> 실측 콘텐츠 높이 (목록이 새로 바뀔 때마다 리셋)
  S._vEditOpenIds = new Set(); // 편집창이 열려있는 항목의 id (고정 높이를 더할지 판단용)
  S._vOffsets = computeLogOffsets(list);
  S._vRenderedRange = [-1, -1];

  container.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.style.height = S._vOffsets[list.length] + 'px';
  spacer.style.pointerEvents = 'none';
  container.appendChild(spacer);
  S._vSpacer = spacer;
  // 목록이 통째로 바뀌면(검색 포함) 기존 재활용 풀의 인덱스는 이제 다른 항목을 가리키므로 비운다.
  // container.innerHTML로 DOM은 이미 지워졌지만, 풀 자체를 안 비우면 사라진 엘리먼트를 그대로
  // 참조해서 재사용하려다가 화면에 반영이 안 되는(비어보이는) 문제가 있었다.
  S._vElByIdx = new Map();
  S._vInternalScroll = true;
  S._vInternalScrollTarget = 0;
  container.scrollTop = 0;

  renderVisibleLogRows();
}

// 이분 탐색: offsets[i] <= y < offsets[i+1]인 i를 찾음 (편집 탭/미리보기 공통)
function findRowIndex(offsets, y) {
  let lo = 0, hi = offsets.length - 2;
  if (hi < 0) return 0;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (offsets[mid + 1] <= y) lo = mid + 1; else hi = mid;
  }
  return lo;
}

function renderVisibleLogRows() {
  const container = $('log-list');
  const list = S._vList;
  if (!list || !list.length) return;
  let offsets = S._vOffsets;
  const scrollTop = container.scrollTop;
  const viewH = container.clientHeight || 600;
  const BUFFER_PX = 400; // 위아래 여유분 (스크롤이 빨라도 빈 화면이 안 보이게)

  const startIdx = findRowIndex(offsets, Math.max(0, scrollTop - BUFFER_PX));
  const endIdx = Math.min(list.length, findRowIndex(offsets, scrollTop + viewH + BUFFER_PX) + 1);

  const [prevStart, prevEnd] = S._vRenderedRange;
  if (startIdx === prevStart && endIdx === prevEnd) return; // 범위 안 바뀌었으면 다시 안 그림
  S._vRenderedRange = [startIdx, endIdx];

  if (!S._vElByIdx) S._vElByIdx = new Map();

  // 더 이상 필요 없는 기존 항목들을 재활용 풀로 회수 (DOM에서 떼지 않고 재사용 대기)
  const pool = [];
  S._vElByIdx.forEach((el, idx) => {
    if (idx < startIdx || idx >= endIdx) pool.push(el);
  });
  pool.forEach(el => { S._vElByIdx.delete(Number(el.dataset.vIdx)); });

  const frag = document.createDocumentFragment();
  const rendered = [];
  for (let i = startIdx; i < endIdx; i++) {
    let el = S._vElByIdx.get(i);
    if (!el) {
      const entry = list[i];
      if (pool.length) {
        // 재활용: 기존 DOM 노드를 재사용해서 내용/이벤트만 새 항목 것으로 다시 바인딩 (제거 후 재삽입보다 저렴)
        el = makeLogItem(entry, S._vIdToIndex.get(entry.id), pool.pop());
      } else {
        el = makeLogItem(entry, S._vIdToIndex.get(entry.id));
      }
      el.dataset.vIdx = i;
      S._vElByIdx.set(i, el);
      if (!el.isConnected) frag.appendChild(el);
    }
    // top 대신 transform으로 위치 지정: 레이아웃 재계산 없이 GPU 합성만으로 처리되어 훨씬 가볍다.
    el.style.transform = `translateY(${offsets[i]}px)`;
    rendered.push([i, el]);
  }
  pool.forEach(el => el.remove()); // 재활용 안 된 나머지는 실제로 제거
  if (frag.childNodes.length) container.appendChild(frag);

  // 실제 렌더링된 콘텐츠 높이를 즉시(동기적으로) 측정해서 추정치와 다르면 오프셋을 보정 (겹침/빈틈 방지).
  // getBoundingClientRect()는 호출 시점에 레이아웃을 강제로 계산해주므로 프레임을 기다릴 필요가 없다 -
  // 오히려 미루면 빠른 스크롤 중 측정 전에 항목이 제거되어 영영 보정 안 되는 문제가 있었다.
  let localChanged = false;
  rendered.forEach(([i, el]) => {
    const entry = list[i];
    if (S._vEditOpenIds.has(entry.id)) return;
    const realH = Math.round(el.getBoundingClientRect().height);
    if (realH > 0 && realH !== logRowContentHeight(i)) { recordLogRowMeasurement(i, realH); localChanged = true; }
  });
  if (localChanged) {
    const oldOffsets = offsets;
    const currentScrollTop = container.scrollTop;
    // 지금 스크롤 위치가 보정 전 기준 몇 번째 항목 근처인지 찾아서, 그 항목이 보정으로 얼마나
    // 밀렸는지(delta)를 스크롤 위치에도 반영한다 (안 그러면 위쪽 카드가 보정될 때마다 화면이 튄다).
    const anchorIdx = findRowIndex(oldOffsets, currentScrollTop);
    const newOffsets = computeLogOffsets(list);
    const delta = newOffsets[anchorIdx] - oldOffsets[anchorIdx];
    S._vOffsets = newOffsets;
    S._vSpacer.style.height = newOffsets[list.length] + 'px';
    S._vElByIdx.forEach((itemEl, vi) => {
      itemEl.style.transform = `translateY(${newOffsets[vi]}px)`;
    });
    if (delta !== 0) {
      S._vInternalScroll = true;
      S._vInternalScrollTarget = currentScrollTop + delta;
      container.scrollTop = S._vInternalScrollTarget;
    }
  }
}

// 편집 토글 등으로 높이가 바뀐 뒤에는, 단순히 기존 항목 위치만 재조정하는 게 아니라
// "지금 화면 범위에 뭐가 들어와야 하는지"부터 다시 판단해야 한다 (경계에 있는 카드를 편집할 때
// 그 확장으로 새로 포함/제외돼야 할 항목이 생길 수 있어서). 범위를 무효화해서 강제로 다시 계산시킨다.
function forceRerenderVisibleLogRows() {
  if (!S._vList) return;
  S._vOffsets = computeLogOffsets(S._vList);
  if (S._vSpacer) S._vSpacer.style.height = S._vOffsets[S._vList.length] + 'px';
  S._vRenderedRange = [-1, -1];
  renderVisibleLogRows();
}

function makeLogItem(entry, idx, reuseDiv) {
  const isOther = entry.tab === 'other';
  const speakerColor = isOther ? '#808080' : (S.speakerColorsEnabled[entry.key] ? (S.speakerColors[entry.key] ?? entry.color) : entry.color);
  const div = reuseDiv || document.createElement('div');
  div.className = `log-item${entry.hidden ? ' muted' : ''}`;
  const editOpenClass = (S._vEditOpenIds && S._vEditOpenIds.has(entry.id)) ? ' open' : '';

  // 검색 중이면 이름/메시지 표시(편집용 textarea 제외)에 일치 부분을 <mark>로 강조한다.
  const isCurrentMatch = isCurrentSearchMatch('log', idx);
  const nameHtml = highlightMatchesInText(esc(entry.name), searchState.log.query, isCurrentMatch);
  const messageHtml = highlightMatchesInText(esc(entry.message), searchState.log.query, isCurrentMatch);

  // 잡담/일반 카드 두 분기가 공통으로 쓰는 조각 (액션 버튼, 편집 영역)
  const actionsHtml = `
        <div class="log-actions">
          <button class="icon-btn icon-btn-fixed" data-a="edit" title="편집"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
          <button class="icon-btn icon-btn-fixed" data-a="hide" title="${entry.hidden?'표시':'숨기기'}">${entry.hidden
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a19.87 19.87 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a19.87 19.87 0 0 1-2.26 3.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>'}</button>
          <button class="icon-btn icon-btn-fixed" data-a="del"  title="삭제"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg></button>
        </div>`;
  const editAreaHtml = `
      <div class="log-edit-area${editOpenClass}">
        <textarea class="log-textarea">${esc(entry.message)}</textarea>
        <div class="log-edit-btns">
          <button class="btn-sm" data-a="cancel">취소</button>
          <button class="btn-sm" data-a="save">저장</button>
        </div>
      </div>`;

  if (isOther) {
    div.innerHTML = `
      <div class="log-head">
        <span class="log-inline">
          <span class="log-speaker-inline">${nameHtml}</span>
          <span> : </span>
          <span class="log-body-inline">${messageHtml}</span>
        </span>
        ${actionsHtml}
      </div>${editAreaHtml}`;
  } else {
    div.innerHTML = `
      <div class="log-head">
        <span class="log-speaker" data-key="${esc(entry.key)}" style="color:${esc(speakerColor)}">${nameHtml}</span>
        <span class="log-tab-chip">${esc(entry.tab)}</span>
        ${entryTimeLabel(entry) ? `<span class="log-time">${esc(entryTimeLabel(entry))}</span>` : ''}
        ${actionsHtml}
      </div>
      <div class="log-body">${messageHtml}</div>${editAreaHtml}`;
  }

  const body     = div.querySelector('.log-body, .log-body-inline');
  const editArea = div.querySelector('.log-edit-area');
  const textarea = div.querySelector('.log-textarea');
  const editAreaContentHeight = editAreaHeightFor(entry) - EDIT_AREA_GAP; // margin-top은 height 속성에 안 들어가니 제외
  editArea.style.height = editAreaContentHeight + 'px';

  div.querySelector('[data-a="edit"]').onclick   = () => {
    editArea.classList.toggle('open');
    if (editArea.classList.contains('open')) S._vEditOpenIds.add(entry.id); else S._vEditOpenIds.delete(entry.id);
    forceRerenderVisibleLogRows();
  };
  div.querySelector('[data-a="cancel"]').onclick = () => {
    textarea.value = S.edited[idx].message;
    editArea.classList.remove('open');
    S._vEditOpenIds.delete(entry.id);
    forceRerenderVisibleLogRows();
  };
  div.querySelector('[data-a="save"]').onclick   = () => {
    S.edited[idx].message = textarea.value;
    if (body) body.textContent = textarea.value;
    editArea.classList.remove('open');
    S._vEditOpenIds.delete(entry.id);
    forceRerenderVisibleLogRows();
    doRefreshPreview();
  };
  div.querySelector('[data-a="hide"]').onclick = () => {
    S.edited[idx].hidden = !S.edited[idx].hidden;
    renderLogList();
    doRefreshPreview();
  };
  div.querySelector('[data-a="del"]').onclick = () => {
    S.edited.splice(idx, 1);
    renderLogList();
    doRefreshPreview();
  };
  return div;
}

// ── 미리보기 (출력 패널 우측 고정) ───────────────────────────────
function setupPreviewPanel() {
  // 테마·옵션 변경 시 자동 갱신
  $('out-theme').addEventListener('change', () => {
    // 체크됐지만 사용자가 직접 바꾸지 않은 탭은 새 테마 카드 색상으로 갱신
    const themeCard = (THEMES[$('out-theme').value] || THEMES.default).card;
    Object.keys(S.tabBgColorsEnabled).forEach(tab => {
      if (S.tabBgColorsEnabled[tab] && !S.tabBgColorsCustom[tab]) S.tabBgColors[tab] = themeCard;
    });
    renderTabBgColors();
    patchTheme($('out-theme').value);
    // 탭 배경색 중 "커스텀 안 하고 테마색 따라가는" 것들은 값이 바뀌었으니 패치도 갱신
    Object.keys(S.tabBgColorsEnabled).forEach(tab => {
      if (S.tabBgColorsEnabled[tab] && !S.tabBgColorsCustom[tab]) patchTabBgColor(tab, true, themeCard);
    });
  });
  $('opt-tab').addEventListener('change', () => patchShowToggle('hide-tab', $('opt-tab').checked));
  $('opt-img').addEventListener('change', () => patchShowToggle('hide-img', $('opt-img').checked));
  $('opt-date').addEventListener('change', () => patchShowToggle('hide-date', $('opt-date').checked));
  // 제목은 Enter 또는 포커스 해제 시에만 갱신
  $('out-title').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); patchTitle($('out-title').value || 'CCFOLIA LOG'); } });
  $('out-title').addEventListener('blur', () => patchTitle($('out-title').value || 'CCFOLIA LOG'));

  // 미리보기 찾기(Ctrl+F 스타일): 목록은 그대로 두고 일치 위치로 이동 + 강조만 한다
  const psb = $('preview-search-box');
  let previewSearchTimer = null;
  psb.addEventListener('input', () => {
    clearTimeout(previewSearchTimer);
    previewSearchTimer = setTimeout(runPreviewSearch, 200);
  });
  psb.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); goToSearchMatch('preview', e.shiftKey ? -1 : 1); }
  });
  $('btn-preview-search-next').addEventListener('click', () => goToSearchMatch('preview', 1));
  $('btn-preview-search-prev').addEventListener('click', () => goToSearchMatch('preview', -1));
  $('btn-preview-search-clear').addEventListener('click', () => {
    clearTimeout(previewSearchTimer);
    psb.value = '';
    clearSearch('preview');
  });
}

// ══════════════════════════════════════════════════════════════════
// 출력 미리보기: Shadow DOM + 가상 스크롤
// iframe+doc.write() 대신, 같은 문서 안에서 Shadow DOM으로 스타일만 격리하고
// 편집 탭과 동일한 원리(오프셋 미리 계산 → 보이는 범위만 실제 DOM으로)를 적용한다.
// 실제 다운로드/복사 파일은 buildOutputHtml()이 그대로 완전한 정적 HTML을 만들어서 이 엔진과 무관하다.
// ══════════════════════════════════════════════════════════════════
const PREVIEW_ROW_H = { other: 34, normal: 96 };
const PREVIEW_ROW_H_CALIBRATED = { other: null, normal: null };
const PREVIEW_ROW_GAP = 9; // .entry의 margin-bottom

function initPreviewShadow() {
  const host = $('preview-host');
  if (!host) return null;
  if (host.shadowRoot) return host.shadowRoot;
  const shadow = host.attachShadow({ mode: 'open' });
  shadow.innerHTML = `
    <style id="sp-style"></style>
    <div class="sp-root" id="sp-root" style="height:100%;overflow-y:auto;position:relative;box-sizing:border-box;overflow-anchor:none;">
      <div class="wrap">
        <h1 id="sp-title"></h1>
        <div id="sp-rows" style="position:relative;">
          <div id="sp-spacer" style="pointer-events:none;"></div>
        </div>
      </div>
    </div>`;
  S._pShadow = shadow;
  S._pRootEl = shadow.getElementById('sp-root');
  S._pRowsEl = shadow.getElementById('sp-rows');
  S._pSpacer = shadow.getElementById('sp-spacer');
  S._pStyleEl = shadow.getElementById('sp-style');
  S._pTitleEl = shadow.getElementById('sp-title');

  let scrollScheduled = false;
  S._pRootEl.addEventListener('scroll', () => {
    if (S._pInternalScroll) {
      S._pInternalScroll = false;
      // 우리가 옮기려던 값과 실제로 일치할 때만 무시한다. 그 사이 사용자가 추가로 스크롤해서
      // 값이 달라졌다면(브라우저가 두 변경을 한 이벤트로 합쳐 보고), 그건 무시하면 안 되는
      // 진짜 사용자 스크롤이므로 정상적으로 아래 로직을 계속 진행시킨다.
      if (Math.abs(S._pRootEl.scrollTop - S._pInternalScrollTarget) < 1) return;
    }
    if (scrollScheduled) return;
    scrollScheduled = true;
    requestAnimationFrame(() => { scrollScheduled = false; renderVisiblePreviewRows(); });
  });
  window.addEventListener('resize', () => renderVisiblePreviewRows());
  return shadow;
}

function previewRowType(i) { return rowType(S._pList, i); }

function previewRowContentHeight(i) {
  return calibratedOrDefault(S._pMeasured, i, previewRowType(i), PREVIEW_ROW_H_CALIBRATED, PREVIEW_ROW_H);
}

const PREVIEW_CALIBRATION_SAMPLES = { other: [], normal: [] };
const PREVIEW_CALIBRATION_TARGET = 12; // 이 개수만큼 모은 뒤 중앙값으로 고정

function recordPreviewRowMeasurement(i, realH) {
  S._pMeasured.set(i, realH);
  const type = previewRowType(i);
  const calibrated = medianCalibrate(PREVIEW_CALIBRATION_SAMPLES[type], PREVIEW_CALIBRATION_TARGET, realH);
  if (calibrated !== undefined) PREVIEW_ROW_H_CALIBRATED[type] = calibrated;
}

function computePreviewOffsets(list) { return computeOffsets(list, PREVIEW_ROW_GAP, previewRowContentHeight); }

let _previewTimer = null;
// 목록/테마/표시옵션 등 구조적으로 바뀔 때 전체를 다시 계산 (가상 스크롤이라 대용량이어도 빠름).
// btn-refresh 같은 수동 갱신은 없고, 로드/필터/편집(숨김·삭제·저장)·탭칩 토글 시 호출됨.
function doRefreshPreview() {
  clearTimeout(_previewTimer);
  _previewTimer = setTimeout(renderPreviewList, 0);
}

// 캐릭터 색상/탭 배경색 설정을 CSS 변수 선언 목록으로 변환 (미리보기/다운로드 공통)
function computeRootVarDecls(keyCssIdx, tabCssIdx) {
  const rootVarDecls = [];
  Object.keys(keyCssIdx).forEach(key => {
    if (S.speakerColorsEnabled[key] !== false) {
      const c = S.speakerColors[key];
      if (c) rootVarDecls.push(`--ck${keyCssIdx[key]}:${c}`);
    }
  });
  Object.keys(tabCssIdx).forEach(tab => {
    if (S.tabBgColorsEnabled[tab] && S.tabBgColors[tab]) rootVarDecls.push(`--tbg${tabCssIdx[tab]}:${S.tabBgColors[tab]}`);
  });
  return rootVarDecls;
}

function renderPreviewList() {
  const shadow = initPreviewShadow();
  if (!shadow) return;
  if ($('preview-search-box')) $('preview-search-box').value = '';
  clearSearch('preview');

  const title = $('out-title').value || 'CCFOLIA LOG';
  const theme = $('out-theme').value;
  const showTab = $('opt-tab').checked;
  const showImg = $('opt-img').checked;
  const showDate = $('opt-date').checked;
  const list = S.edited.filter(e => !e.hidden && S.outputTabs.has(e.tab));

  // 색상/탭배경 CSS 변수 인덱스 계산
  const keyCssIdx = {};
  const tabCssIdx = {};
  function keyIdx(key) { if (!(key in keyCssIdx)) keyCssIdx[key] = Object.keys(keyCssIdx).length; return keyCssIdx[key]; }
  function tabIdx(tab) { if (!(tab in tabCssIdx)) tabCssIdx[tab] = Object.keys(tabCssIdx).length; return tabCssIdx[tab]; }
  list.forEach(e => { tabIdx(e.tab); if (e.tab !== 'other') keyIdx(e.key); });
  S._keyCssIdx = keyCssIdx;
  S._tabCssIdx = tabCssIdx;

  const rootVarDecls = computeRootVarDecls(keyCssIdx, tabCssIdx);

  S._pStyleEl.textContent = previewCssBlock(theme, rootVarDecls, ':host');
  S._pTitleEl.textContent = title;
  S._pRootEl.className = `sp-root ${showTab?'':'hide-tab'} ${showImg?'':'hide-img'} ${showDate?'':'hide-date'}`;

  S._pList = list;
  S._pMeasured = new Map();
  S._pOffsets = computePreviewOffsets(list);
  S._pRenderedRange = [-1, -1];
  S._pSpacer.style.height = S._pOffsets[list.length] + 'px';
  // 목록이 통째로 바뀌면 기존 재활용 풀의 인덱스는 이제 다른 항목을 가리키므로 전부 비운다.
  if (S._pElByIdx) { S._pElByIdx.forEach(el => el.remove()); S._pElByIdx.clear(); } else { S._pElByIdx = new Map(); }
  S._pInternalScroll = true;
  S._pInternalScrollTarget = 0;
  S._pRootEl.scrollTop = 0;

  renderVisiblePreviewRows();
}

function renderVisiblePreviewRows() {
  if (!S._pList || !S._pRowsEl) return;
  const list = S._pList;
  if (!list.length) {
    S._pRowsEl.querySelectorAll('.entry').forEach(el => el.remove());
    if (S._pElByIdx) S._pElByIdx.clear();
    return;
  }
  const offsets = S._pOffsets;
  const scrollTop = S._pRootEl.scrollTop;
  const viewH = S._pRootEl.clientHeight || 600;
  const BUFFER_PX = 600;

  const startIdx = findRowIndex(offsets, Math.max(0, scrollTop - BUFFER_PX));
  const endIdx = Math.min(list.length, findRowIndex(offsets, scrollTop + viewH + BUFFER_PX) + 1);

  const [prevStart, prevEnd] = S._pRenderedRange;
  if (startIdx === prevStart && endIdx === prevEnd) return;
  S._pRenderedRange = [startIdx, endIdx];

  if (!S._pElByIdx) S._pElByIdx = new Map();
  const keyIdxLookup = key => S._keyCssIdx[key];
  const tabIdxLookup = tab => S._tabCssIdx[tab];

  // 더 이상 필요 없는 기존 항목들을 재활용 풀로 회수 (DOM에서 떼지 않고 재사용 대기)
  const pool = [];
  S._pElByIdx.forEach((el, idx) => {
    if (idx < startIdx || idx >= endIdx) pool.push(el);
  });
  pool.forEach(el => { S._pElByIdx.delete(Number(el.dataset.pIdx)); });

  const tmpParser = document.createElement('div');
  const frag = document.createDocumentFragment();
  const rendered = [];
  for (let i = startIdx; i < endIdx; i++) {
    let el = S._pElByIdx.get(i);
    if (!el) {
      const e = list[i];
      tmpParser.innerHTML = renderEntryHtml(e, keyIdxLookup, tabIdxLookup, undefined, i);
      const fresh = tmpParser.firstElementChild;
      if (pool.length) {
        // 재활용: 기존 DOM 노드의 클래스/스타일/내용만 새 항목 것으로 교체 (제거 후 재삽입보다 저렴).
        // 모든 카드 템플릿(entry/entry-dice/entry-inline)이 전부 <div>라서 안전하게 재사용 가능.
        el = pool.pop();
        el.className = fresh.className;
        el.setAttribute('style', fresh.getAttribute('style') || '');
        el.innerHTML = fresh.innerHTML;
      } else {
        el = fresh;
      }
      // setAttribute('style', ...)가 위치 스타일까지 지워버리므로(재활용 케이스), 매번 다시 적용한다.
      el.style.position = 'absolute';
      el.style.left = '0';
      el.style.right = '0';
      el.style.top = '0px';
      el.dataset.pIdx = i;
      S._pElByIdx.set(i, el);
      if (!el.isConnected) frag.appendChild(el);
    }
    // top 대신 transform으로 위치 지정: 레이아웃 재계산 없이 GPU 합성만으로 처리되어 훨씬 가볍다.
    el.style.transform = `translateY(${offsets[i]}px)`;
    rendered.push([i, el]);
  }
  pool.forEach(el => el.remove()); // 재활용 안 된 나머지는 실제로 제거
  if (frag.childNodes.length) S._pRowsEl.appendChild(frag);

  // 실제 렌더링된 높이를 즉시(동기적으로) 측정해서 추정치와 다르면 보정.
  // getBoundingClientRect()는 호출 시점에 브라우저가 레이아웃을 강제로 계산해주므로 프레임을
  // 기다릴 필요가 없다 - 오히려 다음 프레임까지 미루면, 빠르게 스크롤할 때 이 카드가 측정 전에
  // 이미 화면 밖으로 밀려나 제거되어 버려서 그 카드의 높이가 영영 보정 안 되는 문제가 있었다.
  let changed = false;
  rendered.forEach(([i, el]) => {
    const realH = Math.round(el.getBoundingClientRect().height);
    if (realH > 0 && realH !== previewRowContentHeight(i)) { recordPreviewRowMeasurement(i, realH); changed = true; }
  });
  if (changed) {
    const oldOffsets = S._pOffsets;
    const currentScrollTop = S._pRootEl.scrollTop;
    // 지금 스크롤 위치가 "보정 전" 기준으로 몇 번째 항목 근처인지 찾아서, 그 항목의 위치가
    // 보정으로 인해 얼마나 밀렸는지(delta)를 스크롤 위치에도 그대로 반영한다.
    // 이렇게 안 하면 위쪽 카드 높이가 보정될 때마다 지금 보던 화면이 위아래로 튄다.
    const anchorIdx = findRowIndex(oldOffsets, currentScrollTop);
    const newOffsets = computePreviewOffsets(list);
    const delta = newOffsets[anchorIdx] - oldOffsets[anchorIdx];
    S._pOffsets = newOffsets;
    S._pSpacer.style.height = newOffsets[list.length] + 'px';
    S._pElByIdx.forEach((itemEl, vi) => {
      itemEl.style.transform = `translateY(${newOffsets[vi]}px)`;
    });
    if (delta !== 0) {
      S._pInternalScroll = true;
      S._pInternalScrollTarget = currentScrollTop + delta;
      S._pRootEl.scrollTop = S._pInternalScrollTarget;
    }
  }
}

// ── 미리보기 즉시 패치 (전체 재생성 없이) ──────────────────────────
// Shadow DOM 안에서는 :host에 심어둔 CSS 변수가 그대로 상속되므로, 바깥(light DOM)의
// #preview-host 엘리먼트에 직접 style을 세팅하면 안쪽 전체에 즉시 반영된다.
function patchShowToggle(cls, on) {
  if (!S._pRootEl) return;
  S._pRootEl.classList.toggle(cls, !on);
}
function patchTitle(title) {
  if (!S._pTitleEl) return;
  S._pTitleEl.textContent = title;
}
function patchTheme(themeName) {
  const host = $('preview-host'); if (!host) return;
  const t = THEMES[themeName] || THEMES.default;
  host.style.setProperty('--bg', t.bg);
  host.style.setProperty('--card', t.card);
  host.style.setProperty('--text', t.text);
  host.style.setProperty('--sub', t.sub);
  host.style.setProperty('--border', t.border);
  host.style.setProperty('--badge', t.badge);
  host.style.setProperty('--font', t.font);
  host.style.setProperty('--other-color', themeName === 'dark' ? '#707070' : '#aaaaaa');
  host.style.setProperty('--dice-name-bg', themeName === 'dark' ? '#111' : '#2a2a2a');
}
function patchSpeakerColor(key, enabled, color) {
  const host = $('preview-host'); if (!host || !S._keyCssIdx) return;
  const idx = S._keyCssIdx[key];
  if (idx == null) return; // 미리보기에 아직 없는 캐릭터면 다음 전체 갱신 때 반영됨
  if (enabled && color) host.style.setProperty(`--ck${idx}`, color);
  else host.style.removeProperty(`--ck${idx}`);
}
function patchTabBgColor(tab, enabled, color) {
  const host = $('preview-host'); if (!host || !S._tabCssIdx) return;
  const idx = S._tabCssIdx[tab];
  if (idx == null) return;
  if (enabled && color) host.style.setProperty(`--tbg${idx}`, color);
  else host.style.removeProperty(`--tbg${idx}`);
}
function patchSpeakerImage(key, enabled, uniformUrl) {
  if (!S._pShadow || !S._keyCssIdx) return;
  const idx = S._keyCssIdx[key];
  if (idx == null) return;
  S._pShadow.querySelectorAll(`[data-img-key="${idx}"]`).forEach(el => {
    const origImg = el.dataset.origImg || '';
    const url = enabled ? uniformUrl : origImg;
    let newEl;
    if (url) {
      newEl = document.createElement('img');
      newEl.className = 'entry-img';
      newEl.alt = '';
      newEl.src = url;
      newEl.onerror = function () { this.style.visibility = 'hidden'; };
    } else {
      newEl = document.createElement('div');
      newEl.className = 'entry-img-empty';
    }
    newEl.dataset.imgKey = String(idx);
    newEl.dataset.origImg = origImg;
    el.replaceWith(newEl);
  });
}

// ── 출력 패널 ─────────────────────────────────────────────────────
function setupExportPanel() {
  // 사이드바 섹션 즉시 토글
  document.querySelectorAll('.sidebar-section-header').forEach(header => {
    header.addEventListener('mousedown', e => {
      e.preventDefault();
      const section = header.closest('.sidebar-section');
      section.classList.toggle('collapsed');
      const arrow = header.querySelector('.sidebar-section-arrow');
      if (arrow) arrow.textContent = section.classList.contains('collapsed') ? '▸' : '▾';
    });
  });

  // 사이드바 리사이즈
  const handle = $('resize-handle');
  const leftPane = $('export-left');
  let dragging = false, startX = 0, startW = 0;
  const previewHost = $('preview-host');
  handle.addEventListener('mousedown', e => {
    dragging = true; startX = e.clientX; startW = leftPane.offsetWidth;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    previewHost.style.pointerEvents = 'none'; // 드래그 중 불필요한 hover 계산 방지
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const w = Math.min(480, Math.max(180, startW + e.clientX - startX));
    leftPane.style.width = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    previewHost.style.pointerEvents = ''; // 차단 해제
  });

  $('btn-download').addEventListener('click', () => {
    const html = buildOutputHtml(exportOpts());
    const name = ($('out-title').value || 'ccfolia-log').replace(/[\\/:*?"<>|]/g,'_');
    dlFile(html, `${name}.html`, 'text/html;charset=utf-8');
  });

  $('btn-copy-html').addEventListener('click', async () => {
    const html = buildOutputHtml(exportOpts());
    try {
      await navigator.clipboard.writeText(html);
      flash($('btn-copy-html'), '✅ 복사됨!', '📋 HTML 복사');
    } catch {
      // clipboard API 실패 시 textarea 폴백
      const ta = document.createElement('textarea');
      ta.value = html; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      flash($('btn-copy-html'), '✅ 복사됨!', '📋 HTML 복사');
    }
  });
}

function exportOpts() {
  return { title: $('out-title').value || 'CCFOLIA LOG', theme: $('out-theme').value, showTab: $('opt-tab').checked, showImg: $('opt-img').checked, showDate: $('opt-date').checked, entries: S.edited.filter(e => !e.hidden && S.outputTabs.has(e.tab)) };
}

// 탭 이름 한글 표시, 정렬 순서(메인/정보/잡담 우선, 나머지는 가나다순) - 여러 곳에서 공통 사용
const TAB_LABEL = { main:'메인', info:'정보', other:'잡담', secret:'비밀' };
const TAB_ORDER = ['main','info','other'];
function sortedOutputTabs(tabs) {
  const priority = tabs.filter(t => TAB_ORDER.includes(t)).sort((a,b) => TAB_ORDER.indexOf(a)-TAB_ORDER.indexOf(b));
  const rest = tabs.filter(t => !TAB_ORDER.includes(t)).sort((a,b) => a.localeCompare(b,'ko'));
  return [...priority, ...rest];
}

function renderOutTabChips() {
  const c = $('out-tab-chips');
  const tabs = [...new Set(S.edited.map(e => e.tab))];
  if (!tabs.length) { c.innerHTML = '<span class="hint-text">로그를 불러오면 표시됩니다.</span>'; return; }
  // outputTabs를 현재 edited의 탭으로 동기화 (새로 진입 시)
  tabs.forEach(t => { if (!S.outputTabs.has(t) && S.outputTabs.size === 0) S.outputTabs.add(t); });
  c.innerHTML = '';
  const sortedTabs = sortedOutputTabs(tabs);
  sortedTabs.forEach(tab => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (S.outputTabs.has(tab) ? ' on' : '');
    btn.dataset.tab = tab;
    btn.textContent = TAB_LABEL[tab] ?? tab;
    btn.addEventListener('click', () => {
      const on = btn.classList.toggle('on');
      on ? S.outputTabs.add(tab) : S.outputTabs.delete(tab);
      doRefreshPreview();
    });
    c.appendChild(btn);
  });
}

function renderSpeakerColors() {
  const c = $('speaker-colors');
  // key = "name::color" 기준으로 중복 제거 후 이름 가나다 정렬
  const nonOtherKeys = [...new Set(S.edited.filter(e => e.tab !== 'other').map(e => e.key))];
  nonOtherKeys.sort((a,b) => a.split('')[0].localeCompare(b.split('')[0],'ko'));
  if (!nonOtherKeys.length) { c.innerHTML = '<span class="hint-text">로그를 불러오면 표시됩니다.</span>'; return; }
  c.innerHTML = '';
  const isValidHex = v => /^#[0-9a-fA-F]{6}$/.test(v);
  // 같은 이름으로 여러 키가 있는지 체크
  const nameCount = {};
  nonOtherKeys.forEach(k => { const n=k.split('')[0]; nameCount[n]=(nameCount[n]||0)+1; });
  nonOtherKeys.forEach(key => {
    const [name, origColor] = key.split('');
    const row = document.createElement('div'); row.className = 'speaker-row';
    const enabled = S.speakerColorsEnabled[key] !== false;
    const chk = document.createElement('input'); chk.type='checkbox'; chk.checked=enabled;
    chk.style.cssText='accent-color:var(--accent);margin-right:2px;flex-shrink:0';
    const initColor = S.speakerColors[key] ?? origColor ?? '#aaaaaa';
    const swatchWrap = document.createElement('span'); swatchWrap.className='color-swatch-wrap';
    const swatch = document.createElement('span'); swatch.className='color-swatch'+(enabled?'':' disabled');
    swatch.style.background = initColor;
    const picker = document.createElement('input'); picker.type='color';
    picker.value = /^#[0-9a-fA-F]{6}$/.test(initColor) ? initColor : '#aaaaaa';
    picker.disabled=!enabled; picker.tabIndex=-1;
    swatchWrap.append(swatch, picker);
    const hexInp = document.createElement('input'); hexInp.className='hex-input'; hexInp.maxLength=7;
    hexInp.value = initColor; hexInp.disabled=!enabled; hexInp.placeholder='#aaaaaa';
    const syncColor = (v) => { S.speakerColors[key]=v; swatch.style.background=v; picker.value=v; hexInp.value=v; };
    const applyColor = () => {
      const activeColor = S.speakerColorsEnabled[key] ? (S.speakerColors[key] ?? origColor) : origColor;
      swatch.style.background = activeColor;
      document.querySelectorAll(`.log-speaker[data-key="${CSS.escape(key)}"]`).forEach(el => {
        el.style.color = activeColor;
      });
      patchSpeakerColor(key, S.speakerColorsEnabled[key] !== false, S.speakerColors[key] ?? origColor);
    };
    chk.addEventListener('change', () => {
      hexInp.disabled=!chk.checked; picker.disabled=!chk.checked;
      swatch.className='color-swatch'+(chk.checked?'':' disabled');
      S.speakerColorsEnabled[key]=chk.checked;
      applyColor();
    });
    picker.addEventListener('change', () => { syncColor(picker.value); applyColor(); });
    hexInp.addEventListener('input', () => {
      let v = hexInp.value.trim();
      if (!v.startsWith('#')) v = '#'+v;
      if (isValidHex(v)) { syncColor(v); applyColor(); }
    });
    hexInp.addEventListener('blur', () => {
      let v = hexInp.value.trim();
      if (!v.startsWith('#')) v = '#'+v;
      if (!isValidHex(v)) hexInp.value = S.speakerColors[key] ?? origColor ?? '#aaaaaa';
      else hexInp.value = v;
    });
        const lb = document.createElement('span'); lb.className='speaker-name'; lb.textContent = name;
    // 같은 이름+다른 색상이 있으면 원본 색 도트 표시
    if (nameCount[name] > 1) {
      const dot = document.createElement('span');
      dot.title = origColor;
      dot.style.cssText = `display:inline-block;width:10px;height:10px;border-radius:50%;background:${origColor};flex-shrink:0;margin-left:4px;border:1px solid var(--border2)`;
      row.append(chk, swatchWrap, hexInp, lb, dot);
    } else {
      row.append(chk, swatchWrap, hexInp, lb);
    }
    c.appendChild(row);
  });
}

function renderTabBgColors() {
  const c = $('tab-bg-colors');
  const tabs = [...new Set(S.edited.map(e=>e.tab))];
  if (!tabs.length) { c.innerHTML='<span class="hint-text">로그를 불러오면 표시됩니다.</span>'; return; }
  c.innerHTML = '';
  const sortedTabs = sortedOutputTabs(tabs);
