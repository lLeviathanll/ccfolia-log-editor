    chk.style.cssText='accent-color:var(--accent);margin-right:2px;flex-shrink:0';
    const getThemeCard = () => (THEMES[$('out-theme').value] || THEMES.default).card;
    const initVal = S.tabBgColorsCustom[tab] ? S.tabBgColors[tab] : getThemeCard();
    const isValidHex = v => /^#[0-9a-fA-F]{6}$/.test(v);
    const swatchWrap = document.createElement('span'); swatchWrap.className='color-swatch-wrap';
    const swatch = document.createElement('span'); swatch.className='color-swatch'+(enabled?'':' disabled');
    swatch.style.background = initVal;
    const picker = document.createElement('input'); picker.type='color';
    picker.value = isValidHex(initVal) ? initVal : '#000000';
    picker.disabled=!chk.checked; picker.tabIndex=-1;
    swatchWrap.append(swatch, picker);
    const hexInp = document.createElement('input'); hexInp.className='hex-input'; hexInp.maxLength=7;
    hexInp.value = initVal; hexInp.disabled=!chk.checked; hexInp.placeholder='#000000';
    chk.addEventListener('change', () => {
      hexInp.disabled=!chk.checked; picker.disabled=!chk.checked;
      swatch.className='color-swatch'+(chk.checked?'':' disabled');
      S.tabBgColorsEnabled[tab]=chk.checked;
      if (chk.checked && !S.tabBgColorsCustom[tab]) { const tc=getThemeCard(); hexInp.value=tc; picker.value=tc; swatch.style.background=tc; S.tabBgColors[tab]=tc; }
      patchTabBgColor(tab, chk.checked, S.tabBgColors[tab]);
    });
    picker.addEventListener('change', () => {
      S.tabBgColors[tab]=picker.value; S.tabBgColorsCustom[tab]=true;
      hexInp.value=picker.value; swatch.style.background=picker.value;
      patchTabBgColor(tab, S.tabBgColorsEnabled[tab], S.tabBgColors[tab]);
    });
    hexInp.addEventListener('input', () => {
      let v = hexInp.value.trim();
      if (!v.startsWith('#')) v = '#'+v;
      if (isValidHex(v)) {
        S.tabBgColors[tab]=v; S.tabBgColorsCustom[tab]=true; swatch.style.background=v; picker.value=v;
        patchTabBgColor(tab, S.tabBgColorsEnabled[tab], S.tabBgColors[tab]);
      }
    });
    hexInp.addEventListener('blur', () => {
      let v = hexInp.value.trim();
      if (!v.startsWith('#')) v = '#'+v;
      if (!isValidHex(v)) { hexInp.value = S.tabBgColors[tab] || getThemeCard(); }
      else { hexInp.value = v; }
    });
        const lb=document.createElement('span'); lb.className='speaker-name'; lb.textContent=TAB_LABEL[tab]??tab;
    row.append(chk,swatchWrap,hexInp,lb); c.appendChild(row);
  });
}

function renderSpeakerImages() {
  const c = $('speaker-images');
  const speakerKeys = [...new Set(S.edited.filter(e => e.tab !== 'other').map(e => e.key))]
    .sort((a, b) => a.split('')[0].localeCompare(b.split('')[0], 'ko'));
  if (!speakerKeys.length) { c.innerHTML = '<span class="hint-text">로그를 불러오면 표시됩니다.</span>'; return; }
  c.innerHTML = '';
  const nameCount = {};
  speakerKeys.forEach(k => { const n=k.split('')[0]; nameCount[n]=(nameCount[n]||0)+1; });
  speakerKeys.forEach(key => {
    const [name, origColor] = key.split('');
    const row = document.createElement('div'); row.className = 'speaker-img-row';

    const enabled = S.speakerImagesEnabled[key] === true;

    // 라벨 행: 체크박스 + 썸네일 + 이름 (+ 색 도트)
    const labelRow = document.createElement('div'); labelRow.className = 'speaker-img-label';
    const chk = document.createElement('input'); chk.type='checkbox'; chk.checked=enabled;
    chk.style.cssText='accent-color:var(--accent);margin-right:2px;flex-shrink:0';
    chk.title = '체크: 아래 URL을 이 캐릭터의 모든 카드에 일괄 적용 / 해제: 각 카드 원본 이미지로 복구';
    const thumb = document.createElement('img'); thumb.className = 'speaker-img-thumb'+(enabled?'':' disabled');
    const existingUrl = S.speakerImages[key] || '';
    if (existingUrl) { thumb.src = existingUrl; thumb.classList.add('show'); }
    const lb = document.createElement('span'); lb.className = 'speaker-img-name'; lb.textContent = name;
    labelRow.append(chk, thumb, lb);
    if (nameCount[name] > 1) {
      const dot = document.createElement('span');
      dot.title = origColor;
      dot.style.cssText = `display:inline-block;width:9px;height:9px;border-radius:50%;background:${origColor};flex-shrink:0;margin-left:4px;border:1px solid var(--border2)`;
      labelRow.appendChild(dot);
    }

    // URL 입력 필드
    const inp = document.createElement('input');
    inp.type = 'text'; inp.className = 'speaker-img-input';
    inp.placeholder = '이미지 URL 입력…';
    inp.value = existingUrl;
    inp.disabled = !enabled;

    const update = () => {
      const url = inp.value.trim();
      S.speakerImages[key] = url;
      if (url) { thumb.src = url; thumb.classList.add('show'); }
      else { thumb.src = ''; thumb.classList.remove('show'); }
      patchSpeakerImage(key, S.speakerImagesEnabled[key] === true, url);
    };

    chk.addEventListener('change', () => {
      S.speakerImagesEnabled[key] = chk.checked;
      inp.disabled = !chk.checked;
      thumb.classList.toggle('disabled', !chk.checked);
      patchSpeakerImage(key, chk.checked, S.speakerImages[key] || '');
    });

    inp.addEventListener('blur', update);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); update(); } });

    row.append(labelRow, inp);
    c.appendChild(row);
  });
}

// ── HTML 생성기 ───────────────────────────────────────────────────
const THEMES = {
  default:{ bg:'#f5f5f5', card:'#ffffff', text:'#333', sub:'#666',  border:'#ddd',    badge:'#eee',    font:"-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" },
  novel:  { bg:'#faf7f2', card:'#fffef9', text:'#3a2e28', sub:'#8b6f47', border:'#e8d5b0', badge:'#f0e8d8', font:"Georgia, 'Noto Serif KR', serif" },
  minimal:{ bg:'#fff',    card:'#fff',    text:'#444', sub:'#999',  border:'#eee',    badge:'#f4f4f4', font:"Inter, 'Malgun Gothic', sans-serif" },
  dark:   { bg:'#1a1a1a', card:'#242424', text:'#e0e0e0', sub:'#888', border:'#383838', badge:'#333',  font:"-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif" }
};

// ── 주사위 판별 (미리보기/다운로드 공통) ──
function getDiceGrade(msg) {
  if (!msg.includes('＞')) return null;
  // 결과 키워드 순서 중요: 긴 것부터 매칭
  if (/대성공|大成功|クリティカル|スペシャル|CRITICAL|SPECIAL/i.test(msg)) return 'critical';
  if (/극단적.?성공|イクストリーム成功|EXTREME.?SUCCESS/i.test(msg)) return 'extreme';
  if (/어려운.?성공|ハード成功|HARD.?SUCCESS/i.test(msg)) return 'hard';
  if (/대단한.?성공/.test(msg)) return 'hard';
  if (/보통.?성공|成功|성공|SUCCESS/i.test(msg)) return 'success';
  if (/대실패|大失敗|ファンブル|FUMBLE/i.test(msg)) return 'fumble';
  if (/실패|失敗|FAILURE|FAIL/i.test(msg)) return 'failure';
  return 'roll'; // 결과 키워드 없는 순수 굴림
}
const DICE_COLOR = {
  critical: '#f5a623',
  extreme:  '#1e90ff',
  hard:     '#1e90ff',
  success:  '#6abf69',
  failure:  '#e05555',
  fumble:   '#c0392b',
  roll:     null,
};

// 항목 하나의 HTML을 생성 (미리보기 Shadow DOM과 다운로드 정적 파일이 완전히 같은 마크업을 쓰게 함).
// keyIdx/tabIdx는 함수: 다운로드 시엔 새 인덱스를 만들며(side-effect), 미리보기 시엔 기존 인덱스를 조회만 함.
function renderEntryHtml(e, keyIdx, tabIdx, imgIdx, idx) {
  // 검색 하이라이트는 라이브 미리보기에서만 적용한다 (imgIdx가 있으면 다운로드/정적 파일 생성 경로).
  const isDownload = !!imgIdx;
  const query = isDownload ? '' : searchState.preview.query;
  const isCurrentMatch = !isDownload && isCurrentSearchMatch('preview', idx);
  const nameHtml = highlightMatchesInText(esc(e.name), query, isCurrentMatch);
  const msg = highlightMatchesInText(esc(e.message), query, isCurrentMatch).replace(/\n/g,'<br>');
  const tIdx = tabIdx(e.tab);

  if (e.tab === 'other') {
    return `<div class="entry entry-inline" style="background:var(--tbg${tIdx}, var(--card))"><span class="speaker-inline"><span class="speaker-other">${nameHtml}</span><span class="sep"> : </span><span class="body-inline">${msg}</span></span></div>`;
  }
  if (e.name === 'system') {
    return `<div class="entry entry-dice" style="background:var(--tbg${tIdx}, transparent)"><span class="dice-name">${nameHtml}</span><span class="dice-body" style="color:${e.color}">${msg}</span></div>`;
  }
  const kIdx = keyIdx(e.key);
  const badge = `<span class="badge">${esc(e.tab)}</span>`;
  const timeTag = entryTimeLabel(e) ? `<span class="entry-time">${esc(entryTimeLabel(e))}</span>` : '';
  const imgOverrideOn = S.speakerImagesEnabled[e.key] === true;
  const imgUrl = imgOverrideOn ? (S.speakerImages[e.key] || '') : (e.image || '');
  // data-orig-img(원본 이미지 기억)는 미리보기의 "켜기/끄기 토글" 상호작용에만 필요함.
  // 다운로드 파일(imgIdx 있음)에서는 그 기능이 아예 없으니 넣지 않는다 - 안 그러면 여기서
  // 메시지마다 원본 base64가 다시 통째로 중복 저장되어 위 img-ref 중복 제거가 무의미해짐.
  const origAttr = imgIdx ? '' : ` data-orig-img="${esc(e.image || '')}"`;
  let imgTag;
  if (imgUrl && imgIdx) {
    // 다운로드 파일: 같은 URL(특히 base64 이미지)이 메시지마다 통째로 중복 저장되는 걸 막기 위해
    // <style>에 한 번만 넣고 CSS 클래스로 참조한다 (CCFOLIA 자체 신규 내보내기와 같은 방식).
    imgTag = `<div class="entry-img img-ref-${imgIdx(imgUrl)}" data-img-key="${kIdx}"${origAttr}></div>`;
  } else if (imgUrl) {
    imgTag = `<img class="entry-img" data-img-key="${kIdx}"${origAttr} src="${esc(imgUrl)}" alt="" onerror="this.style.visibility='hidden'" />`;
  } else {
    imgTag = `<div class="entry-img-empty" data-img-key="${kIdx}"${origAttr}></div>`;
  }

  const grade = getDiceGrade(e.message);
  if (grade !== null) {
    const diceColor = DICE_COLOR[grade] || 'var(--text)';
    return `<div class="entry entry-dice" style="background:var(--tbg${tIdx}, transparent)"><span class="dice-name">${nameHtml}</span><span class="dice-body" style="color:${diceColor}">${msg}</span></div>`;
  }

  return `<div class="entry" style="background:var(--tbg${tIdx}, var(--card))"><span class="entry-img-slot">${imgTag}</span><div class="entry-content"><div class="entry-head"><span class="speaker" style="color:var(--ck${kIdx}, ${e.color})" data-key="${kIdx}">${nameHtml}</span>${badge}${timeTag}</div><div class="entry-body">${msg}</div></div></div>`;
}

// 미리보기/다운로드 공통 CSS. rootSelector는 다운로드(정적 문서)면 ':root', Shadow DOM 미리보기면 ':host'.
// (Shadow DOM 안에서 :root는 바깥 문서의 <html>을 가리켜버려서 변수가 안 먹으므로 :host를 써야 함)
function previewCssBlock(theme, rootVarDecls, rootSelector) {
  rootSelector = rootSelector || ':root';
  const t = THEMES[theme] || THEMES.default;
  return `
*{box-sizing:border-box;margin:0;padding:0}
${rootSelector}{
  --bg:${t.bg};--card:${t.card};--text:${t.text};--sub:${t.sub};--border:${t.border};--badge:${t.badge};--font:${t.font};
  --other-color:${theme==='dark'?'#707070':'#aaaaaa'};--dice-name-bg:${theme==='dark'?'#111':'#2a2a2a'};
  ${(rootVarDecls||[]).join(';')}
}

.hide-img .entry-img,.hide-img .entry-img-empty,.hide-img .entry-img-slot{display:none}

.wrap{max-width:720px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;font-weight:700;color:var(--sub);margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.entry{border:1px solid var(--border);border-radius:7px;padding:11px 14px;margin-bottom:9px;display:flex;gap:10px;align-items:flex-start;box-sizing:border-box}
mark.search-mark{background:#f5a623;color:#1a1a1a;border-radius:2px;padding:0 1px}
mark.search-mark-current{background:#ff7a1a;color:#fff}
.entry-inline{padding:6px 14px 6px 28px;overflow:hidden}
.entry-img-slot{display:contents}
.entry-img{width:44px;height:44px;border-radius:4px;object-fit:cover;object-position:50% 20%;background-size:cover;background-position:50% 20%;background-repeat:no-repeat;flex-shrink:0;border:1px solid var(--border);margin-top:1px}

.entry-head{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.speaker{font-size:15.5px;font-weight:700}

.sep{font-weight:400;color:var(--other-color)}.body-inline{font-weight:400;color:var(--other-color);word-break:break-all;overflow-wrap:break-word}
.badge{font-size:10px;padding:0px 6px;border-radius:10px;background:var(--badge);color:var(--sub);border:1px solid var(--border)}

.entry-body{font-size:16px;white-space:pre-wrap;word-break:break-word}

.dice-name{display:inline-flex;align-items:center;font-size:14px;font-weight:700;color:#fff;background:var(--dice-name-bg);border-radius:20px;padding:3px 12px;white-space:nowrap;flex-shrink:0}
.dice-body{font-size:15px;line-height:1.6;word-break:break-all;font-weight:500}`;

function buildOutputHtml({ title, theme, showTab, showImg, showDate, entries, updateIndexMap = false }) {
  // 색상/탭배경 패치용 안정적인 숫자 인덱스 (임의 문자열을 CSS 변수명으로 못 쓰니 매핑).
  // updateIndexMap이 true일 때만(=실시간 미리보기 생성 시) 전역(S)에 동기화한다.
  const keyCssIdx = {};
  const tabCssIdx = {};
  function keyIdx(key) {
    if (!(key in keyCssIdx)) keyCssIdx[key] = Object.keys(keyCssIdx).length;
    return keyCssIdx[key];
  }
  function tabIdx(tab) {
    if (!(tab in tabCssIdx)) tabCssIdx[tab] = Object.keys(tabCssIdx).length;
    return tabCssIdx[tab];
  }

  // 이미지 URL 중복 제거: 같은 URL(특히 base64 이미지)이 메시지마다 통째로 복제되는 걸 막기 위해
  // 고유 URL마다 하나의 CSS 클래스로만 저장하고 각 항목은 그 클래스를 참조한다.
  const imgUrlIdx = {};
  function imgIdx(url) {
    if (!(url in imgUrlIdx)) imgUrlIdx[url] = Object.keys(imgUrlIdx).length;
    return imgUrlIdx[url];
  }

  const rows = entries.map(e => renderEntryHtml(e, keyIdx, tabIdx, imgIdx)).join('\n');

  const imgCssRules = Object.keys(imgUrlIdx)
    .map(url => `.img-ref-${imgUrlIdx[url]}{background-image:url("${url.replace(/"/g, '&quot;')}")}`)
    .join('\n');

  // 에디터 복원용 메타데이터도 이미지를 중복 저장하면 안 되므로, 위와 같은 방식으로
  // 공유 이미지 목록 + 인덱스 참조로 저장한다 (entries[].image, speakerImages[key] 둘 다 해당).
  const metaImages = [];
  const metaImageIdx = {};
  function metaImgRef(url) {
    if (!url) return null;
    if (!(url in metaImageIdx)) { metaImageIdx[url] = metaImages.length; metaImages.push(url); }
    return metaImageIdx[url];
  }
  const entriesForMeta = S.edited.map(e => {
    const { image, ...rest } = e;
    return { ...rest, imgRef: metaImgRef(image) };
  });
  const speakerImagesForMeta = {};
  Object.keys(S.speakerImages).forEach(key => {
    speakerImagesForMeta[key] = metaImgRef(S.speakerImages[key]);
  });

  // ── 에디터 복원용 메타데이터 ──
  const editorMeta = JSON.stringify({
    version: VERSION,
    title,
    theme,
    showTab,
    showImg,
    showDate,
    entries: entriesForMeta,
    images: metaImages,
    outputTabs: [...S.outputTabs],
    speakerColors: S.speakerColors,
    speakerColorsEnabled: S.speakerColorsEnabled,
    speakerImages: speakerImagesForMeta,
    speakerImagesEnabled: S.speakerImagesEnabled,
    tabBgColors: S.tabBgColors,
    tabBgColorsEnabled: S.tabBgColorsEnabled,
    tabBgColorsCustom: S.tabBgColorsCustom,
  });

  const rootVarDecls = computeRootVarDecls(keyCssIdx, tabCssIdx);

  if (updateIndexMap) {
    S._keyCssIdx = keyCssIdx;
    S._tabCssIdx = tabCssIdx;
  }

  const bodyClass = `${showTab?'':'hide-tab'} ${showImg?'':'hide-img'} ${showDate?'':'hide-date'}`;
  return `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(title)}</title>
<style>${previewCssBlock(theme, rootVarDecls, ':root')}\n${imgCssRules}</style></head><body class="${bodyClass}">
<div class="wrap"><h1>${esc(title)}</h1>
${rows}
</div>
<script type="application/json" id="ccfolia-editor-data">${editorMeta.replace(/<\/script>/g,'<\/script>')}<\/script>
</body></html>`;
}

function setStatus(id, type, msg) { const el=$(id); el.className=`status ${type}`; el.textContent=msg; }
function switchPanel(targetId) {
  document.querySelectorAll('.nav-tab').forEach(b => b.classList.toggle('active', b.dataset.target===targetId));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id===targetId));
  if (targetId === 'panel-edit') {
    S._vRenderedRange = [-1, -1]; // 숨겨진 동안 clientHeight가 0이었을 수 있어 강제로 다시 계산
    renderVisibleLogRows();
  } else if (targetId === 'panel-export') {
    S._pRenderedRange = [-1, -1]; // 숨겨진 동안 clientHeight가 0이었을 수 있어 강제로 다시 계산
    renderVisiblePreviewRows();
  }
}
function flash(btn, on, off) { btn.textContent=on; setTimeout(()=>{ btn.textContent=off; }, 2000); }
function dlFile(content, name, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
